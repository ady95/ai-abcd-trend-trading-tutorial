[project]
name = "ai-abcd-trend-trading-tutorial"
version = "0.1.0"
description = "AI로 검증하는 주도주 ABCD 눌림목 자동매매 따라하기 - 예제코드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "plotly>=5.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "jupyterlab>=4.2",
]
dashboard = [
    "streamlit>=1.36",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
